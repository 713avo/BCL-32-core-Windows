name: Release

# Push a tag such as v1.2 to publish the portable ZIP as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the cross-compiler (Zig)
        run: ./tools/install-dev.sh

      - name: Build the portable ZIP
        run: make portable

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "BCL-32 core for Windows ${GITHUB_REF_NAME}" \
            --notes "Portable build: unzip and run \`bcl.exe\`. See the README for requirements."
